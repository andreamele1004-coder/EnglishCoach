<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>English Coach</title>
<meta name="description" content="Corso di inglese da 30 minuti al giorno: grammatica, ascolto, conversazione, flashcard e quiz.">
<meta name="theme-color" content="#d9532b">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Nunito+Sans:wght@400;600;700;800;900&display=swap">
<style>
/* Layout: app mobile a colonna singola, barra schede in basso; la sessione si apre a schermo intero sopra. */
:root{
  --bg:#f5f2ec; --surface:#fffdf9; --surface2:#efe9df; --line:#e0d8cb; --ink:#1d2129; --muted:#6b6f78;
  --accent:#d9532b; --accent-ink:#fff; --ok:#1f8a70; --ok-bg:#e3f3ed; --bad:#c43d3d; --bad-bg:#fbe7e5; --warn:#b7791f;
  --display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif; --body:"Nunito Sans","Segoe UI",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#14161b; --surface:#1d2027; --surface2:#262a33; --line:#323743; --ink:#eef0f4; --muted:#9aa0ab;
  --accent:#f0714a; --ok:#3cc29a; --ok-bg:#16332b; --bad:#ef6a6a; --bad-bg:#3a1f22; --warn:#e3a341; color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14161b; --surface:#1d2027; --surface2:#262a33; --line:#323743; --ink:#eef0f4; --muted:#9aa0ab;
  --accent:#f0714a; --ok:#3cc29a; --ok-bg:#16332b; --bad:#ef6a6a; --bad-bg:#3a1f22; --warn:#e3a341; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button,input,textarea,select{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.15;text-wrap:balance}
h1{font-size:1.6rem} h2{font-size:1.25rem} h3{font-size:1.05rem}
p{margin:0}
.app{max-width:640px;margin:0 auto;padding:16px 16px calc(92px + env(safe-area-inset-bottom,0px))}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:4px 0 16px}
.top .brand{font-family:var(--display);font-weight:700;font-size:1.15rem}
.top .brand span{color:var(--accent)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:var(--surface2);font-size:.85rem;font-weight:700;white-space:nowrap}
.stack{display:grid;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:grid;gap:12px}
.muted{color:var(--muted)} .small{font-size:.88rem}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}
.btn{appearance:none;border:0;border-radius:12px;padding:12px 16px;font-weight:800;background:var(--accent);color:var(--accent-ink);cursor:pointer;font-size:1rem;text-align:center}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.soft{background:var(--surface2);color:var(--ink)}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{padding:8px 12px;font-size:.9rem;border-radius:10px}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.progress{height:12px;border-radius:999px;background:var(--surface2);overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);border-radius:999px;transition:width .4s}
.big{font-family:var(--display);font-size:2.4rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kv div{background:var(--surface2);border-radius:12px;padding:10px}
.kv b{display:block;font-family:var(--display);font-size:1.2rem;font-variant-numeric:tabular-nums}
.kv small{color:var(--muted);font-size:.75rem}
.blocks{display:grid;gap:6px}
.blk{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:var(--surface2);border:0;width:100%;text-align:left;cursor:pointer}
.blk .dot{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center;font-size:.75rem;font-weight:900}
.blk.done .dot{background:var(--ok);border-color:var(--ok);color:#fff}
.blk .min{margin-left:auto;color:var(--muted);font-size:.85rem}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav.tabs .in{display:flex;width:100%;max-width:640px}
nav.tabs button{flex:1;border:0;background:none;padding:10px 4px 12px;display:grid;justify-items:center;gap:3px;font-size:.75rem;font-weight:700;color:var(--muted);cursor:pointer}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button[aria-current="page"]{color:var(--accent)}
/* Sessione */
.session{position:fixed;inset:0;background:var(--bg);z-index:10;overflow-y:auto;display:none}
.session.on{display:block}
.session .in{max-width:640px;margin:0 auto;padding:12px 16px calc(32px + env(safe-area-inset-bottom,0px));display:grid;gap:14px}
.shead{display:flex;align-items:center;gap:10px;position:sticky;top:0;background:var(--bg);padding:8px 0;z-index:2}
.shead .x{border:0;background:var(--surface2);width:40px;height:40px;border-radius:12px;font-size:1.2rem;cursor:pointer;flex:none}
.shead .t{flex:1;min-width:0}
.shead .t b{display:block;font-family:var(--display)}
.shead .t small{color:var(--muted)}
.timer{font-variant-numeric:tabular-nums;font-weight:800}
.steps{display:flex;gap:4px}
.steps i{flex:1;height:5px;border-radius:3px;background:var(--surface2)}
.steps i.on{background:var(--accent)} .steps i.done{background:var(--ok)}
.q{font-size:1.15rem;font-weight:700}
.opts{display:grid;gap:8px}
.opt{border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;text-align:left;cursor:pointer;font-size:1rem}
.opt.sel{border-color:var(--accent)}
.opt.ok{border-color:var(--ok);background:var(--ok-bg)}
.opt.ko{border-color:var(--bad);background:var(--bad-bg)}
input.txt,textarea.txt,select.txt{width:100%;border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;font-size:1rem}
textarea.txt{min-height:150px;resize:vertical}
.fb{border-radius:12px;padding:12px 14px;font-weight:700}
.fb.ok{background:var(--ok-bg);color:var(--ok)} .fb.ko{background:var(--bad-bg);color:var(--bad)}
.rule{border-left:4px solid var(--accent)}
.eg{display:grid;gap:6px}
.eg div{display:flex;gap:8px;align-items:flex-start}
.say{border:0;background:var(--surface2);border-radius:8px;width:32px;height:32px;flex:none;cursor:pointer;display:grid;place-items:center}
.say svg{width:18px;height:18px}
.mist{display:grid;gap:6px;font-size:.95rem}
.mist div{display:grid;grid-template-columns:1fr;gap:2px;padding:8px 10px;border-radius:10px;background:var(--surface2)}
.mist s{color:var(--bad);text-decoration-thickness:2px}
.mist b{color:var(--ok)}
.flash{min-height:230px;display:grid;align-content:center;justify-items:center;text-align:center;gap:10px}
.flash .w{font-family:var(--display);font-size:2rem;font-weight:700}
.grade{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.grade button{border:0;border-radius:12px;padding:12px 4px;font-weight:800;cursor:pointer;background:var(--surface2);font-size:.9rem}
.grade button small{display:block;font-weight:600;color:var(--muted);font-size:.72rem}
.mic{width:76px;height:76px;border-radius:50%;border:0;background:var(--accent);color:#fff;display:grid;place-items:center;cursor:pointer;margin:0 auto}
.mic svg{width:34px;height:34px}
.mic.on{animation:pulse 1.2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(217,83,43,.5)}100%{box-shadow:0 0 0 18px rgba(217,83,43,0)}}
.chat{display:grid;gap:8px}
.msg{padding:10px 12px;border-radius:14px;max-width:88%}
.msg.ai{background:var(--surface);border:1px solid var(--line)}
.msg.me{background:var(--accent);color:#fff;justify-self:end}
.list{display:grid;gap:8px}
.res{display:grid;gap:4px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface)}
.res.ok{border-color:var(--ok)} .res.ko{border-color:var(--bad)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:12px;font-weight:700;z-index:30;max-width:90vw;font-size:.9rem}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.modal .sheet{background:var(--bg);width:100%;max-width:640px;max-height:90vh;overflow-y:auto;border-radius:20px 20px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom,0px));display:grid;gap:12px}
.tag{font-size:.72rem;font-weight:900;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.week{display:grid;gap:6px}
.lesson-row{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.lesson-row:last-child{border-bottom:0}
.lesson-row .n{width:28px;height:28px;border-radius:8px;background:var(--surface2);display:grid;place-items:center;font-weight:800;font-size:.8rem;flex:none}
.lesson-row.done .n{background:var(--ok);color:#fff}
.lesson-row.cur .n{background:var(--accent);color:#fff}
.bar-row{display:grid;grid-template-columns:1fr 90px 40px;gap:8px;align-items:center;font-size:.88rem}
.bar-row .progress{height:8px}
label.f{display:grid;gap:6px;font-weight:700;font-size:.92rem}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{border:2px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px;font-weight:700;cursor:pointer}
.seg button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent);color:#fff}
details summary{cursor:pointer;font-weight:700}
.hidden{display:none!important}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

</style>
</head>
<body>
<main class="app" id="view"></main>
<nav class="tabs" id="tabs" aria-label="Sezioni"></nav>
<section class="session" id="session" aria-label="Sessione"></section>
<script>
/* ===== Contenuti del corso =====
   RULES: regole di grammatica. Ogni regola ha spiegazione in inglese semplice, 3 esempi,
   i 3 errori più comuni degli italiani e un "pool" di esercizi per quiz e ripasso.
   Esercizi: {q, o:[opzioni], a:indice}  oppure  {q, a:['risposta', 'alternativa']} (da scrivere). */
const RULES = {
  'ps-form': {
    t: 'Present simple: he / she / it + -s',
    ex: 'Use the present simple for routines, habits and facts. With I, you, we, they use the base verb. With he, she, it add -s (-es after -ch, -sh, -s, -x, -o; consonant + y becomes -ies). Have becomes has.',
    eg: ['I start work at 8.', 'She works in a warehouse.', 'The truck leaves at 6 every morning.'],
    common: [['He work in Prato.', 'He works in Prato.'], ['She gos to the gym.', 'She goes to the gym.'], ['My boss haves a meeting.', 'My boss has a meeting.']],
    pool: [
      { q: 'My colleague ___ (drive) to work every day.', a: ['drives'] },
      { q: 'The office ___ at 8:30.', o: ['open', 'opens', 'opening'], a: 1 },
      { q: 'Marco ___ (fix) the scanners when they break.', a: ['fixes'] },
      { q: 'They ___ lunch at one.', o: ['has', 'have', 'having'], a: 1 },
      { q: 'My sister ___ (try) a new recipe every Sunday.', a: ['tries'] },
      { q: 'The courier ___ two deliveries to Prato every morning.', o: ['do', 'does', 'doing'], a: 1 }
    ]
  },
  'ps-q': {
    t: 'Present simple: questions and negatives (do / does)',
    ex: 'Questions: Do / Does + subject + base verb. Negatives: don\'t / doesn\'t + base verb. With does and doesn\'t the main verb has NO -s: the -s is already in "does".',
    eg: ['Do you work on Saturdays?', 'Does she drive to work?', 'He doesn\'t work on Sundays.'],
    common: [['Does he works in an office?', 'Does he work in an office?'], ['She don\'t like coffee.', 'She doesn\'t like coffee.'], ['You work here?', 'Do you work here?']],
    pool: [
      { q: '___ your manager speak English?', o: ['Do', 'Does', 'Is'], a: 1 },
      { q: 'We ___ (not / work) on Sundays.', a: ['don\'t work', 'do not work'] },
      { q: 'Does the truck ___ at six?', o: ['leaves', 'leave', 'leaving'], a: 1 },
      { q: 'She ___ (not / like) long meetings.', a: ['doesn\'t like', 'does not like'] },
      { q: '___ you check the orders every day?', o: ['Do', 'Does', 'Are'], a: 0 },
      { q: 'What time ___ the warehouse close?', o: ['do', 'does', 'is'], a: 1 }
    ]
  },
  'prep-time': {
    t: 'Prepositions of time: at / on / in',
    ex: 'AT + a clock time (at 7, at noon, at night). ON + a day or a date (on Monday, on 5 May, on Friday morning). IN + a month, a year, a season or a part of the day (in May, in 2026, in the morning).',
    eg: ['I start at 7 o\'clock.', 'We have a meeting on Monday.', 'I go running in the evening.'],
    common: [['on the morning', 'in the morning'], ['at Monday', 'on Monday'], ['in 7 o\'clock', 'at 7 o\'clock']],
    pool: [
      { q: 'The meeting is ___ Thursday.', o: ['in', 'on', 'at'], a: 1 },
      { q: 'I usually finish ___ five.', o: ['in', 'on', 'at'], a: 2 },
      { q: 'My holiday is ___ August.', o: ['in', 'on', 'at'], a: 0 },
      { q: 'We play football ___ Monday evening.', o: ['in', 'on', 'at'], a: 1 }
    ]
  },
  'art-a': {
    t: 'a / an',
    ex: 'Use A before a consonant SOUND and AN before a vowel SOUND. Listen to the sound, not the letter: an hour (h is silent), a university (it starts with a "y" sound).',
    eg: ['I need a report.', 'She sent an email.', 'It takes an hour.'],
    common: [['a email', 'an email'], ['an university', 'a university'], ['a hour', 'an hour']],
    pool: [
      { q: 'I need ___ hour to finish.', o: ['a', 'an'], a: 1 },
      { q: 'She has ___ university degree.', o: ['a', 'an'], a: 0 },
      { q: 'He works for ___ Italian company.', o: ['a', 'an'], a: 1 },
      { q: 'We use ___ new scanner.', o: ['a', 'an'], a: 0 }
    ]
  },
  'adv-freq': {
    t: 'Adverbs of frequency: position',
    ex: 'Always, usually, often, sometimes, rarely, never go BEFORE the main verb (I usually drive), but AFTER the verb "be" (He is never late). In questions they go after the subject (Do you often travel?).',
    eg: ['I usually have lunch at one.', 'She is always on time.', 'We rarely work on Saturdays.'],
    common: [['I go usually to work by car.', 'I usually go to work by car.'], ['She always is late.', 'She is always late.'], ['Never I eat breakfast.', 'I never eat breakfast.']],
    pool: [
      { q: 'Choose the correct sentence.', o: ['I check always the orders.', 'I always check the orders.', 'Always I check the orders.'], a: 1 },
      { q: 'Choose the correct sentence.', o: ['He is often tired on Mondays.', 'He often is tired on Mondays.', 'Often he tired on Mondays.'], a: 0 },
      { q: 'Put "never" in the right place: "I ___ drink coffee after six."', o: ['never', '(after "drink")', '(at the end)'], a: 0 },
      { q: 'Choose the correct question.', o: ['Do you travel often for work?', 'Do often you travel for work?', 'Do you often travel for work?'], a: 2 },
      { q: 'Choose the correct sentence.', o: ['We sometimes are busy.', 'We are sometimes busy.', 'Sometimes are we busy.'], a: 1 }
    ]
  },
  'pc-form': {
    t: 'Present continuous: am / is / are + -ing',
    ex: 'Use the present continuous for actions happening now and for temporary situations (this week, this month, at the moment). Form: am / is / are + verb-ing. Do not forget the verb "be".',
    eg: ['I\'m working on a new report.', 'She is talking to a courier at the moment.', 'This week we are testing a new system.'],
    common: [['I working on it.', 'I\'m working on it.'], ['She is work now.', 'She is working now.'], ['They are study English this month.', 'They are studying English this month.']],
    pool: [
      { q: 'Look! The truck ___ (arrive).', a: ['is arriving', '\'s arriving'] },
      { q: 'I ___ on a new dashboard this week.', o: ['work', 'am working', 'working'], a: 1 },
      { q: 'They ___ (wait) for the delivery right now.', a: ['are waiting', '\'re waiting'] },
      { q: 'Choose the correct sentence.', o: ['She is write an email.', 'She writing an email.', 'She is writing an email.'], a: 2 },
      { q: 'What ___ you doing at the moment?', o: ['do', 'are', 'is'], a: 1 }
    ]
  },
  'art-the': {
    t: 'the / no article',
    ex: 'Use NO article when you talk about things in general: plural nouns, uncountable nouns, sports, languages (I like football, Logistics is interesting, Life is hard). Use THE for something specific that we both know (The football match last night was great).',
    eg: ['I love music.', 'Coffee keeps me awake.', 'The coffee in our office is terrible.'],
    common: [['The life is hard.', 'Life is hard.'], ['I play the football on Mondays.', 'I play football on Mondays.'], ['I study the English.', 'I study English.']],
    pool: [
      { q: '___ logistics is a very dynamic sector.', o: ['The', '(no article)'], a: 1 },
      { q: 'Can you close ___ door, please?', o: ['the', '(no article)'], a: 0 },
      { q: 'I play ___ football twice a week.', o: ['the', '(no article)'], a: 1 },
      { q: '___ report you sent me is perfect.', o: ['The', '(no article)'], a: 0 }
    ]
  },
  'stative': {
    t: 'Simple or continuous? State verbs',
    ex: 'Use the present simple for habits and the present continuous for now. Some verbs describe states, not actions: know, want, need, like, love, prefer, mean, understand, believe, depend. We usually do NOT use them in the continuous.',
    eg: ['I usually drive, but today I\'m taking the train.', 'I know the answer.', 'I need more time.'],
    common: [['I am knowing him.', 'I know him.'], ['I\'m needing a break.', 'I need a break.'], ['He works now.', 'He is working now.']],
    pool: [
      { q: 'I ___ what you mean.', o: ['understand', 'am understanding'], a: 0 },
      { q: 'Today she ___ from home.', o: ['works', 'is working'], a: 1 },
      { q: 'We ___ more people in the warehouse.', o: ['need', 'are needing'], a: 0 },
      { q: 'He usually ___ the bus, but this week he is driving.', o: ['takes', 'is taking'], a: 0 },
      { q: 'This sentence ___ "the delivery is late".', o: ['means', 'is meaning'], a: 0 }
    ]
  },
  'prep-fixed': {
    t: 'Fixed prepositions: depend on, interested in, good at…',
    ex: 'Some words always go with the same preposition. Learn them as one block: depend ON, interested IN, good AT, responsible FOR, wait FOR, listen TO.',
    eg: ['It depends on the courier.', 'I\'m interested in data analysis.', 'She is responsible for the orders.'],
    common: [['It depends from the weather.', 'It depends on the weather.'], ['I\'m interested to this job.', 'I\'m interested in this job.'], ['He is good in Excel.', 'He is good at Excel.']],
    pool: [
      { q: 'The delivery time depends ___ the region.', o: ['from', 'of', 'on'], a: 2 },
      { q: 'I\'m very interested ___ the position.', o: ['in', 'to', 'for'], a: 0 },
      { q: 'Who is responsible ___ the shipments?', o: ['of', 'for', 'to'], a: 1 },
      { q: 'She is really good ___ SQL.', o: ['in', 'on', 'at'], a: 2 }
    ]
  }
};

/* Lezioni. Ogni lezione = una sessione da 30 minuti. */
const LESSONS = [
  {
    id: 'w1d1', w: 1, d: 1, title: 'My working day', goal: 'Descrivere la tua giornata con il present simple',
    rule: 'ps-form', extra: 'art-a',
    items: [
      { q: 'My colleague ___ (drive) to work every day.', a: ['drives'] },
      { q: 'The warehouse ___ at 7 a.m.', o: ['open', 'opens', 'opening'], a: 1 },
      { q: 'He ___ (watch) football on Mondays.', a: ['watches'] },
      { q: 'We ___ the shipments every morning.', o: ['checks', 'check', 'checking'], a: 1 },
      { q: 'She ___ (study) English in the evening.', a: ['studies'] },
      { q: 'Andrea ___ in logistics.', o: ['work', 'works', 'is work'], a: 1 }
    ],
    extraItems: [
      { q: 'I sent ___ email to the courier.', o: ['a', 'an'], a: 1 },
      { q: 'It\'s ___ big warehouse.', o: ['a', 'an'], a: 0 }
    ],
    cards: [
      { en: 'commute', it: 'tragitto casa-lavoro', ex: ['My commute takes 40 minutes.', 'I listen to podcasts during my commute.'] },
      { en: 'shift', it: 'turno', ex: ['I work the morning shift.', 'Her shift ends at 2 p.m.'] },
      { en: 'deadline', it: 'scadenza', ex: ['The deadline is on Friday.', 'We never miss a deadline.'] },
      { en: 'to get up', it: 'alzarsi', ex: ['I get up at 6:30.', 'What time do you get up?'] },
      { en: 'it takes me…', it: 'ci metto…', ex: ['It takes me 40 minutes to get to work.', 'It takes her an hour to finish the report.'] },
      { en: 'to finish work', it: 'finire di lavorare', ex: ['I finish work at five.', 'She finishes work late on Fridays.'] }
    ],
    listen: {
      title: 'Laura\'s day',
      text: 'Hi, I\'m Laura. I work in a warehouse near Florence. I get up at six o\'clock and I start work at seven. My commute takes twenty minutes by car. In the morning I check the orders and I call the couriers. I have lunch at one with my colleagues. I finish work at four, and then I go to the gym twice a week.',
      qs: [
        { q: 'What time does Laura start work?', o: ['At six', 'At seven', 'At eight'], a: 1 },
        { q: 'How does she get to work?', o: ['By train', 'By car', 'On foot'], a: 1 },
        { q: 'What does she do in the morning?', o: ['She checks orders and calls couriers', 'She writes reports', 'She meets clients'], a: 0 },
        { q: 'How often does she go to the gym?', o: ['Every day', 'Twice a week', 'Never'], a: 1 }
      ]
    },
    speak: {

/* ---------- Voce: sintesi e riconoscimento ---------- */
let VOICES = [];
function loadVoices() { try { VOICES = speechSynthesis.getVoices().filter(v => /^en/i.test(v.lang)); } catch (e) { VOICES = []; } }
try { loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; } catch (e) { }
function pickVoice(alt) {
  const pref = (S('ec-voice') || {}).voice;
  let v = VOICES.find(x => x.name === pref) || VOICES.find(x => /en-GB/i.test(x.lang)) || VOICES[0];
  if (alt) { const o = VOICES.filter(x => x !== v && /en-(GB|US)/i.test(x.lang)); if (o.length) v = o[0]; }
  return v;
}
function speak(text, opt = {}) {
  return new Promise(res => {
    try {
      speechSynthesis.cancel();
      const segs = opt.dialog ? text.split(/(?=\b[A-Z][a-z]+: )/).filter(Boolean) : [text];
      const names = [];
      let i = 0;
      const next = () => {
        if (i >= segs.length) return res();
        let s = segs[i++], alt = false;
        const m = s.match(/^([A-Z][a-z]+): /);
        if (m) { if (!names.includes(m[1])) names.push(m[1]); alt = names.indexOf(m[1]) % 2 === 1; s = s.slice(m[0].length); }
        const u = new SpeechSynthesisUtterance(s);
        const v = pickVoice(alt); if (v) u.voice = v;
        u.lang = v ? v.lang : 'en-GB';
        u.rate = (opt.rate || (S('ec-voice') || {}).rate || 0.9);
        u.pitch = alt ? 0.85 : 1.05;
        u.onend = next; u.onerror = next;

    } catch (e) { res(); }
  });
}
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
function listen() {
  return new Promise((res, rej) => {
    if (!SR) return rej('nosr');
    const r = new SR(); r.lang = 'en-GB'; r.interimResults = false; r.maxAlternatives = 1;
    let got = false;
    r.onresult = e => { got = true; res(e.results[0][0].transcript); };
    r.onerror = e => rej(e.error || 'err');
    r.onend = () => { if (!got) rej('empty'); };
    try { r.start(); } catch (e) { rej('err'); }
  });
}
function sayBtn(text, dialog) { return `<button class="say" type="button" aria-label="Ascolta" data-say="${esc(text)}"${dialog ? ' data-dialog="1"' : ''}>${ICON.say}</button>`; }
document.addEventListener('click', e => { const b = e.target.closest('[data-say]'); if (b) speak(b.dataset.say, { dialog: !!b.dataset.dialog }); });

/* ---------- AI (Gemini, facoltativa) ---------- */
const aiCfg = () => S('ec-ai') || {};
const aiOn = () => !!(aiCfg().key && aiCfg().model);
async function ai(system, turns, json) {
  const c = aiCfg();
  const body = {
    systemInstruction: { parts: [{ text: system }] },
    contents: turns.map(t => ({ role: t.role === 'ai' ? 'model' : 'user', parts: [{ text: t.text }] })),
    generationConfig: Object.assign({ temperature: 0.6 }, json ? { responseMimeType: 'application/json' } : {})
  };
  const r = await net(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(c.model)}:generateContent?key=${encodeURIComponent(c.key)}`, {
    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body)
  });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error((j.error && j.error.message) || ('HTTP ' + r.status));
  const txt = ((j.candidates || [])[0]?.content?.parts || []).map(p => p.text || '').join('').trim();
  if (!json) return txt;
  try { return JSON.parse(txt.replace(/^```(json)?|```$/g, '')); } catch (e) { throw new Error('Risposta AI non leggibile'); }
}
async function net(url, opt) {
  if (!navigator.onLine) throw new Error('Sei offline: collegati a internet e riprova.');
  try { return await fetch(url, opt || {}); }
  catch (e) {
    // riserva: richiesta "semplice" senza intestazione JSON (evita il controllo preliminare del browser)
    if (opt && opt.method === 'POST') { try { return await fetch(url, Object.assign({}, opt, { headers: { 'Content-Type': 'text/plain;charset=UTF-8' } })); } catch (e2) { } }
    const err = new Error('Connessione a Google non riuscita (' + (e && e.message || e) + '). Vai in Profilo → Diagnosi connessione.'); err.raw = e; throw err;
  }
}
async function aiModels(key) {
  const r = await net('https://generativelanguage.googleapis.com/v1beta/models?pageSize=200&key=' + encodeURIComponent(key.trim()));
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error((j.error && j.error.message) || ('HTTP ' + r.status));
  const ver = n => (n.match(/(\d+(?:\.\d+)?)/) || [0, 0])[1] * 1;
  return (j.models || []).filter(m => (m.supportedGenerationMethods || []).includes('generateContent'))
    .map(m => m.name.replace(/^models\//, ''))
    .filter(n => /gemini/i.test(n) && !/(tts|image|live|embedding|audio|transcribe|translate|vision)/i.test(n))
    .sort((a, b) => (/flash/.test(b) - /flash/.test(a)) || (/lite/.test(a) - /lite/.test(b)) || (ver(b) - ver(a)) || (/preview|exp/.test(a) - /preview|exp/.test(b)));
}

/* ---------- Profilo, tempi, avanzamento ---------- */
const profile = () => S('ec-profile');
const lvName = l => l === 'A0' ? 'pre-A1' : l;
function levelOfHours(h) { let l = 'A0'; LEVELS.forEach(x => { if (LEVEL_H[x] <= h + 0.01) l = x; }); return l; }

function estimate() {
  const p = profile(); if (!p) return null;
  const need = Math.max(1, (LEVEL_H[p.goal] - p.startH) * (p.adj || 1));
  const doneH = totalSec() / 3600;
  const remaining = Math.max(0, need - doneH);
  const planned = p.min * p.days / 60;
  const t = S('ec-time') || {}, daysWith = Object.keys(t).filter(d => d >= addDays(today(), -13) && t[d] > 120).length;
  const real = secOnDays(14) / 3600 / 2;
  const pace = daysWith >= 4 && real > 0 ? real : planned;
  const weeks = remaining / pace;
  return { need, doneH, remaining, pct: Math.min(100, doneH / need * 100), planned, real, pace, usingReal: pace !== planned, eta: addDays(today(), Math.ceil(weeks * 7)), weeks, nowLevel: levelOfHours(p.startH + doneH) };
}
function streak() { const d = S('ec-days') || {}; let n = 0, k = today(); if (!d[k]) k = addDays(k, -1); while (d[k]) { n++; k = addDays(k, -1); } return n; }
const doneMap = () => S('ec-done') || {};
function lessonBlocks(L) { return L.weekly ? [] : ['fc', 'gr', 'li', 'sp', L.translate ? 'tr' : 'qz']; }
function lessonComplete(L) { if (L.weekly) return !!(S('ec-quiz') || {})['w' + L.w]; const m = doneMap()[L.id] || {}; return lessonBlocks(L).every(b => m[b]); }
function currentLesson() { return LESSONS.find(L => !lessonComplete(L)) || null; }
function markBlock(L, b) {
  const m = doneMap(); m[L.id] = m[L.id] || {}; m[L.id][b] = today(); S('ec-done', m);
  if (lessonComplete(L)) { const d = S('ec-days') || {}; d[today()] = L.id; S('ec-days', d); }
}
function logError(r, you, ok, src) { const e = S('ec-errors') || []; e.push({ d: today(), r, you, ok, src, w: SESSION ? SESSION.L.w : 0 }); while (e.length > 600) e.shift(); S('ec-errors', e); }
function ruleStat(r, good) { const s = S('ec-stats') || {}; s[r] = s[r] || { ok: 0, ko: 0 }; s[r][good ? 'ok' : 'ko']++; S('ec-stats', s); }

/* ---------- Tempo di studio: conta solo mentre la sessione è aperta e la usi ---------- */
let lastInput = Date.now();
['pointerdown', 'keydown', 'input'].forEach(ev => document.addEventListener(ev, () => lastInput = Date.now(), true));

setInterval(() => {
  if (!SESSION || document.hidden) return;

/* ---------- Flashcard: ripetizione dilazionata (SM-2 semplificato) ---------- */
const cardsAll = () => S('ec-cards') || {};
function addCards(L) {
  const c = cardsAll(); let n = 0;
  (L.cards || []).forEach((x, i) => { const id = L.id + '-' + i; if (!c[id]) { c[id] = Object.assign({ id, due: today(), iv: 0, ef: 2.5, reps: 0, lapses: 0, w: L.w, isNew: true }, x); n++; } });
  S('ec-cards', c); return n;
}
function addCustomCard(en, it, ex) {
  const c = cardsAll(); const id = 'x-' + norm(en).replace(/\W+/g, '-').slice(0, 40);
  if (c[id]) return false;
  c[id] = { id, en, it, ex: ex ? [ex] : [], due: today(), iv: 0, ef: 2.5, reps: 0, lapses: 0, w: SESSION ? SESSION.L.w : 0, isNew: true, auto: true };
  S('ec-cards', c); return true;
}
function dueCards() { const t = today(); return Object.values(cardsAll()).filter(c => c.due <= t); }
function gradeCard(id, g) { // g: 0 di nuovo, 1 difficile, 2 bene, 3 facile
  const c = cardsAll(), k = c[id]; if (!k) return;
  k.isNew = false;
  if (g === 0) { k.reps = 0; k.iv = 0; k.lapses++; k.ef = Math.max(1.3, k.ef - 0.2); k.due = today(); }
  else {
    if (g === 1) { k.iv = Math.max(1, Math.round((k.iv || 1) * 1.2)); k.ef = Math.max(1.3, k.ef - 0.15); }
    else if (g === 2) { k.iv = k.reps === 0 ? 1 : k.reps === 1 ? 3 : Math.round(k.iv * k.ef); }
    else { k.iv = k.reps === 0 ? 3 : Math.round(Math.max(k.iv, 1) * k.ef * 1.3); k.ef += 0.15; }
    k.reps++; k.due = addDays(today(), k.iv);
  }
  S('ec-cards', c);
}
const nextIv = (k, g) => g === 0 ? 'oggi' : g === 1 ? Math.max(1, Math.round((k.iv || 1) * 1.2)) + ' g' : g === 2 ? (k.reps === 0 ? 1 : k.reps === 1 ? 3 : Math.round(k.iv * k.ef)) + ' g' : (k.reps === 0 ? 3 : Math.round(Math.max(k.iv, 1) * k.ef * 1.3)) + ' g';

/* ---------- Scheda di correzione (dopo ogni errore, in inglese) ---------- */
function filled(item, ans) { return item.q.includes('___') ? item.q.replace(/___\s*(\([^)]*\))?/, ans) : ans; }
function correctText(item) { return item.o ? item.o[item.a] : item.a[0]; }
function correctionHTML(rid, you, ok, extra) {
  const R = RULES[rid];
  let h = `<div class="tag">Correction</div>
    <div class="list"><div class="res ko"><small class="muted">Your answer</small><span>${esc(you || '(no answer)')}</span></div>
    <div class="res ok"><small class="muted">Correct</small><b>${esc(ok)}</b></div></div>`;
  if (extra) h += `<p>${esc(extra)}</p>`;
  if (R) {
    h += `<div class="card rule"><h3>${esc(R.t)}</h3><p>${esc(R.ex)}</p>
      <div class="eg">${R.eg.map(x => `<div>${sayBtn(x)}<span>${esc(x)}</span></div>`).join('')}</div></div>
      <h3>3 common mistakes Italians make</h3>
      <div class="mist">${R.common.map(([w, r]) => `<div><s>${esc(w)}</s><b>✓ ${esc(r)}</b></div>`).join('')}</div>`;
  }
  return h;
}
function showModal(html, btn = 'Got it') {
  return new Promise(res => {
    const m = document.createElement('div'); m.className = 'modal'; m.setAttribute('role', 'dialog'); m.setAttribute('aria-modal', 'true');
    m.innerHTML = `<div class="sheet">${html}<button class="btn block" type="button" data-close>${btn}</button></div>`;
    document.body.appendChild(m);
    m.querySelector('[data-close]').focus();
    m.querySelector('[data-close]').onclick = () => { m.remove(); res(); };
  });
}
function vocabCorrection(item, you) {
  const ok = correctText(item), w = norm(ok);
  const c = Object.values(cardsAll()).find(k => norm(k.en).replace(/^to /, '') === w.replace(/^to /, '') || norm(k.en) === w);
  let h = `<div class="tag">Correction</div><div class="list"><div class="res ko"><small class="muted">Your answer</small><span>${esc(filled(item, you))}</span></div><div class="res ok"><small class="muted">Correct</small><b>${esc(filled(item, ok))}</b></div></div>`;
  if (c) h += `<div class="card"><h3>${esc(c.en)} = ${esc(c.it)}</h3><div class="eg">${(c.ex || []).map(x => `<div>${sayBtn(x)}<span>${esc(x)}</span></div>`).join('')}</div></div>`;
  return h;
}

/* ---------- Domanda singola (scelta multipla o da scrivere) ---------- */
function questionUI(host, item, onDone, opts = {}) {
  host.innerHTML = `${opts.head || ''}<p class="q">${esc(item.q)}</p>${item.listen ? `<div class="row">${sayBtn(item.listen)}<span class="muted small">Ascolta (puoi ripetere)</span></div>` : ''}
    ${item.o ? `<div class="opts">${(item.shuf || (item.shuf = shuffle(item.o.map((_, i) => i)))).map(i => `<button class="opt" type="button" data-i="${i}">${esc(item.o[i])}</button>`).join('')}</div>`
      : `<input class="txt" id="qin" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Scrivi la risposta"><button class="btn block" type="button" id="qok">Controlla</button>`}
    <div id="qfb"></div>`;
  if (item.listen) setTimeout(() => speak(item.listen), 300);
  const finish = (good, you) => {
    if (opts.silent) { onDone(good, you); return; }
    const fb = host.querySelector('#qfb');
    fb.innerHTML = good ? `<div class="fb ok">Correct!</div><button class="btn block" type="button" id="qnext">Continua</button>`
      : `<div class="fb ko">Not quite. Correct: ${esc(correctText(item))}</div><button class="btn block" type="button" id="qnext">Continua</button>`;
    const go = () => onDone(good, you);
    host.querySelector('#qnext').onclick = go;
    if (!good) {
      const rid = item.r || opts.rule;
      if (rid === 'vocab') showModal(vocabCorrection(item, you));
      else if (RULES[rid]) showModal(correctionHTML(rid, filled(item, you), filled(item, correctText(item))));
    }
  };
  if (item.o) host.querySelectorAll('.opt').forEach(b => b.onclick = () => {
    const i = +b.dataset.i, good = i === item.a;
    host.querySelectorAll('.opt').forEach(x => { x.disabled = true; if (!opts.silent) { if (+x.dataset.i === item.a) x.classList.add('ok'); else if (x === b) x.classList.add('ko'); } else if (x === b) x.classList.add('sel'); });
    finish(good, item.o[i]);
  });
  else {
    const inp = host.querySelector('#qin'); inp.focus();
    const check = () => { const v = inp.value.trim(); if (!v) return; inp.disabled = true; host.querySelector('#qok').remove(); finish(item.a.some(a => norm(a) === norm(v)), v); };
    host.querySelector('#qok').onclick = check; inp.onkeydown = e => { if (e.key === 'Enter') check(); };
  }
}

/* ---------- Sessione ---------- */
let SESSION = null;
function openSession(L, only) {
  SESSION = { L, sec: 0, blocks: only ? [only] : lessonBlocks(L).filter(b => !(doneMap()[L.id] || {})[b]), i: 0, stats: { ok: 0, ko: 0 } };
  if (!SESSION.blocks.length) SESSION.blocks = lessonBlocks(L);
  if (L.weekly) SESSION.blocks = ['wq'];
  $('#session').classList.add('on'); document.body.style.overflow = 'hidden';
  runBlock();
}
function closeSession() { flushTime(); try { speechSynthesis.cancel(); } catch (e) { } SESSION = null; $('#session').classList.remove('on'); document.body.style.overflow = ''; render(); }
function shell(title, sub) {
  const s = SESSION, n = s.blocks.length;
  $('#session').innerHTML = `<div class="in"><div class="shead"><button class="x" type="button" id="sx" aria-label="Chiudi">✕</button>
    <div class="t"><b>${esc(title)}</b><small>${esc(sub || s.L.title)}</small></div><span class="timer" id="stimer">${mmss(s.sec)}</span></div>
    ${n > 1 ? `<div class="steps">${s.blocks.map((b, i) => `<i class="${i < s.i ? 'done' : i === s.i ? 'on' : ''}"></i>`).join('')}</div>` : ''}
    <div id="sbody" class="stack"></div></div>`;
  $('#sx').onclick = closeSession;
  $('#session').scrollTop = 0;
  return $('#sbody');
}
function blockDone(b) {
  markBlock(SESSION.L, b); SESSION.i++;
  if (SESSION.i < SESSION.blocks.length) runBlock(); else sessionEnd();
}
function runBlock() { const b = SESSION.blocks[SESSION.i]; ({ fc: blockFlash, gr: blockGrammar, li: blockListen, sp: blockSpeak, qz: blockQuiz, tr: blockTranslate, wq: blockWeekly })[b](); }
function sessionEnd() {
  flushTime();
  const s = SESSION, L = s.L, complete = lessonComplete(L), e = estimate();
  const body = shell(complete ? 'Sessione completata' : 'Blocco completato');
  const tot = s.stats.ok + s.stats.ko;
  body.innerHTML = `<div class="card"><div class="tag">${esc(L.title)}</div><h2>${complete ? 'Ottimo lavoro!' : 'Fatto.'}</h2>
    <div class="kv"><div><b>${mmss(s.sec)}</b><small>minuti</small></div><div><b>${tot ? Math.round(s.stats.ok / tot * 100) + '%' : '–'}</b><small>risposte giuste</small></div><div><b>${streak()}</b><small>giorni di fila</small></div></div>
    ${e ? `<p class="small muted">Percorso verso ${profile().goal}: ${e.pct.toFixed(1)}% · arrivo stimato ${fmtDate(e.eta)}</p>` : ''}</div>
    <button class="btn block" type="button" id="send">Torna alla home</button>`;
  $('#send').onclick = closeSession;
}

/* Blocco 1: flashcard */
function blockFlash() {
  const L = SESSION.L; addCards(L);
  const t = today(), c = cardsAll();
  const fresh = Object.values(c).filter(k => k.id.startsWith(L.id + '-') && k.isNew);
  const due = Object.values(c).filter(k => k.due <= t && !(k.id.startsWith(L.id + '-') && k.isNew)).sort((a, b) => a.due < b.due ? -1 : 1).slice(0, 25);
  let queue = [...due.map(k => k.id), ...fresh.map(k => k.id)], again = {};

  const show = () => {

      <div class="card flash"><div class="w">${esc(k.en)}</div>${sayBtn(k.en)}<div id="back" class="hidden stack" style="justify-items:center">
      <div class="q">${esc(k.it)}</div><div class="eg" style="text-align:left">${(k.ex || []).map(x => `<div>${sayBtn(x)}<span>${esc(x)}</span></div>`).join('')}</div></div></div>
      <button class="btn block" type="button" id="flip">Mostra significato ed esempi</button>
      <div class="grade hidden" id="gr">${['Di nuovo', 'Difficile', 'Bene', 'Facile'].map((g, i) => `<button type="button" data-g="${i}">${g}<small>${nextIv(k, i)}</small></button>`).join('')}</div>`;
    setTimeout(() => speak(k.en), 200);
    $('#flip').onclick = () => { $('#back').classList.remove('hidden'); $('#flip').classList.add('hidden'); $('#gr').classList.remove('hidden'); speak(k.ex && k.ex[0] || k.en); };
    body.querySelectorAll('[data-g]').forEach(b => b.onclick = () => {
      const g = +b.dataset.g, id = queue.shift(); gradeCard(id, g);

}

/* Quiz settimanale: 10 domande, risposte alla fine, punti deboli */
function weekRules(w) { const s = new Set(); LESSONS.filter(L => L.w === w && !L.weekly).forEach(L => { if (!L.review) s.add(L.rule); if (L.extra) s.add(L.extra); (L.items || []).forEach(i => i.r && s.add(i.r)); }); return [...s]; }
function buildWeekly(w) {
  const rules = weekRules(w), errs = (S('ec-errors') || []).filter(e => e.w === w && RULES[e.r]);
  const weight = r => 1 + errs.filter(e => e.r === r).length;
  const pickRules = shuffle(rules).sort((a, b) => weight(b) - weight(a)).slice(0, 4);
  const qs = pickRules.map(r => Object.assign({ r, kind: 'Grammar' }, shuffle(RULES[r].pool)[0]));
  const cards = shuffle(LESSONS.filter(L => L.w === w).flatMap(L => L.cards || []));
  const vc = cards.filter(c => !/…/.test(c.en));
  const W = c => c.en.replace(/^to /, '').trim();
  vc.slice(0, 3).forEach(c => {
    const word = W(c), re = new RegExp('\\b' + word.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '\\w*', 'i');
    const ex = (c.ex || []).find(x => re.test(x));
    const q = ex ? ex.replace(re, '___') + `  (${c.it})` : `How do you say "${c.it}" in English?`;
    const o = shuffle([word, ...shuffle(vc.filter(x => x !== c)).slice(0, 2).map(W)]);
    qs.push({ r: 'vocab', kind: 'Vocabulary', q, o, a: o.indexOf(word), expl: `${c.en} = ${c.it}. ${(c.ex || [])[0] || ''}` });
  });
  const sents = shuffle(LESSONS.filter(L => L.w === w).flatMap(L => (L.cards || []).flatMap(c => c.ex || [])));
  for (let k = 0; k < 2; k++) { const s = sents[k], o = shuffle([s, sents[k + 2], sents[k + 4]]); qs.push({ r: 'listening', kind: 'Listening', q: 'Which sentence do you hear?', listen: s, o, a: o.indexOf(s), expl: s }); }
  qs.push({ r: 'speaking', kind: 'Speaking', speak: sents[6], q: 'Say this sentence aloud:', expl: sents[6] });
  return qs;
}
function blockWeekly() {
  const L = SESSION.L, w = L.w, body = shell('Quiz settimanale ' + w, '10 domande · risposte alla fine');
  const qs = buildWeekly(w), ans = [];
  let i = 0;

    markBlock(L, 'wq'); const d = S('ec-days') || {}; d[today()] = L.id; S('ec-days', d);

        <span>${esc(q.speak ? 'Say: ' + q.speak : q.q)}</span><span class="small">Tu: ${esc(ans[k].you)}</span>${q.o ? `<b>✓ ${esc(q.o[q.a])}</b>` : ''}
        ${!ans[k].good && RULES[q.r] ? `<span class="small">${esc(RULES[q.r].ex)}</span>` : q.expl && !ans[k].good ? `<span class="small">${esc(q.expl)}</span>` : ''}</div>`).join('')}</div>
      <h2>I tuoi punti deboli</h2>${weak.length ? weak.map(r => {

    body.querySelectorAll('[data-drill]').forEach(b => b.onclick = () => drill(b.dataset.drill, reveal));

function placement() {
  const v = $('#view'); let i = 0; const res = [];
  const items = PLACEMENT.map(x => Object.assign({}, x, { shuf: shuffle(x.o.map((_, k) => k)) }));
  const next = () => {
    if (i >= items.length) return done();
    const it = items[i];
    v.innerHTML = `<div class="card"><div class="progress"><i style="width:${i / items.length * 100}%"></i></div><div id="pq" class="stack"></div><button class="btn ghost sm" type="button" id="dk">Non lo so</button></div>`;
    questionUI($('#pq'), it, good => { res.push({ l: it.l, good }); i++; next(); }, { head: `<p class="small muted">Domanda ${i + 1} / ${items.length}</p>`, silent: true });
    $('#dk').onclick = () => { res.push({ l: it.l, good: false }); i++; next(); };
  };
  const done = () => {
    const ratio = l => { const r = res.filter(x => x.l === l); return r.filter(x => x.good).length / r.length; };
    let level = 'A0';
    for (const l of ['A1', 'A2', 'B1', 'B2']) { if (ratio(l) >= 0.6) level = l; else break; }
    const nx = LEVELS[LEVELS.indexOf(level) + 1], nxR = ['A1', 'A2', 'B1', 'B2'].includes(nx) ? ratio(nx) : 0;
    const startH = LEVEL_H[level] + Math.min(0.6, nxR * 0.6) * (LEVEL_H[nx] - LEVEL_H[level]);
    goalSetup({ level, startH, test: res.filter(x => x.good).length + '/' + res.length });
  };
  next();
}
function goalSetup(base, edit) {
  const v = edit ? $('#view') : $('#view');
  const p = Object.assign({ goal: null, min: 30, days: 7 }, profile() || {}, base);
  const goals = LEVELS.filter((l, i) => i > LEVELS.indexOf(p.level)).slice(0, 3);
  if (!goals.includes(p.goal)) p.goal = goals[0];
  const draw = () => {
    const need = LEVEL_H[p.goal] - p.startH, wk = p.min * p.days / 60, weeks = need / wk;
    v.innerHTML = `<div class="stack"><div class="card"><div class="tag">${base.test ? 'Risultato del test: ' + base.test : 'Livello di partenza'}</div>
      <h2>Livello ${lvName(p.level)}${p.startH > LEVEL_H[p.level] + 5 ? ' (verso ' + LEVELS[LEVELS.indexOf(p.level) + 1] + ')' : ''}</h2></div>
      <div class="card"><label class="f">Obiettivo<div class="seg" data-k="goal">${goals.map(g => `<button type="button" data-v="${g}" aria-pressed="${g === p.goal}">${g}</button>`).join('')}</div></label>
      <label class="f">Minuti al giorno<div class="seg" data-k="min">${[15, 20, 30, 45].map(g => `<button type="button" data-v="${g}" aria-pressed="${g === p.min}">${g}</button>`).join('')}</div></label>
      <label class="f">Giorni a settimana<div class="seg" data-k="days">${[5, 6, 7].map(g => `<button type="button" data-v="${g}" aria-pressed="${g === p.days}">${g}</button>`).join('')}</div></label></div>
      <div class="card"><div class="tag">Stima</div><div class="big">${weeks < 8 ? Math.round(weeks) + ' settimane' : Math.round(weeks / 4.35) + ' mesi'}</div>
      <p>Per arrivare a <b>${p.goal}</b> servono circa <b>${Math.round(need)} ore</b> di studio. Con ${p.min} minuti per ${p.days} giorni (${wk.toFixed(1).replace('.', ',')} ore a settimana) arrivi verso <b>${fmtDate(addDays(today(), Math.ceil(weeks * 7)))}</b>.</p>
      <p class="small muted">Base: ore di apprendimento guidato di Cambridge English. La stima si aggiorna con il tuo ritmo reale e con i quiz settimanali.</p></div>
      <button class="btn block" type="button" id="ok">${edit ? 'Salva' : 'Inizia il corso'}</button></div>`;
    v.querySelectorAll('.seg').forEach(sg => sg.querySelectorAll('button').forEach(b => b.onclick = () => { const k = sg.dataset.k; p[k] = k === 'goal' ? b.dataset.v : +b.dataset.v; draw(); }));
    $('#ok').onclick = () => { if (!p.start) p.start = today(); p.adj = p.adj || 1; S('ec-profile', p); TAB = 'home'; render(); toast('Percorso salvato.'); };
  };
  draw();
}

      <p class="small muted">Crea una chiave gratuita su <b>aistudio.google.com</b> → Get API key, poi incollala qui. Resta solo su questo telefono. Con il piano gratuito Google può usare i testi per migliorare i suoi servizi: non scrivere dati personali.</p>
      <input class="txt" id="key" placeholder="Chiave API Gemini" value="${esc(c.key || '')}" autocomplete="off">
      <div class="row"><select class="txt grow" id="model">${c.model ? `<option>${esc(c.model)}</option>` : '<option value="">Prima carica i modelli</option>'}</select><button class="btn soft sm" type="button" id="lm">Carica modelli</button></div>
      <div class="row"><button class="btn sm" type="button" id="sk">Salva e prova</button><span class="small muted" id="aist">${aiOn() ? 'Configurata' : 'Non configurata'}</span></div>
      <button class="btn ghost sm" type="button" id="diag">Diagnosi connessione</button><pre id="diagout" class="small" style="white-space:pre-wrap;margin:0"></pre></div>
    <div class="card"><h3>Voce</h3><select class="txt" id="voice">${VOICES.map(v => `<option value="${esc(v.name)}"${vc.voice === v.name ? ' selected' : ''}>${esc(v.name)} (${esc(v.lang)})</option>`).join('') || '<option>Voce predefinita</option>'}</select>
      <label class="f">Velocità<input type="range" id="rate" min="0.6" max="1.2" step="0.05" value="${vc.rate || 0.9}"></label><button class="btn soft sm" type="button" id="tv">Prova voce</button></div>
    <div class="card"><h3>Backup dei dati</h3><p class="small muted">${last ? 'Ultimo backup: ' + fmtDate(iso(new Date(last))) + '.' : 'Nessun backup ancora.'} I dati restano solo su questo telefono: se cancelli i dati dei siti in Chrome si perdono.</p>
      <div class="row"><button class="btn sm" type="button" id="bk">Salva backup</button><label class="btn soft sm">Ripristina<input type="file" id="rs" accept=".json,application/json" hidden></label></div></div>
    <div class="card"><h3>Livello e obiettivo</h3><div class="row"><button class="btn soft sm" type="button" id="goal">Cambia obiettivo o ritmo</button><button class="btn ghost sm" type="button" id="retest">Rifai il test</button></div></div></div>`;
  $('#lm').onclick = async () => {
    const k = $('#key').value.replace(/\s+/g, ''); if (!k) return toast('Incolla prima la chiave.');
    $('#aist').textContent = 'Carico…';
    try { const ms = await aiModels(k); if (!ms.length) throw new Error('nessun modello'); $('#model').innerHTML = ms.map(m => `<option>${esc(m)}</option>`).join(''); $('#aist').textContent = ms.length + ' modelli: il primo è il consigliato.'; }
    catch (e) { $('#aist').textContent = 'Errore: ' + e.message; }
  };
  $('#sk').onclick = async () => {
    S('ec-ai', { key: $('#key').value.replace(/\s+/g, ''), model: $('#model').value }); $('#aist').textContent = 'Provo…';
    try { const r = await ai('Reply with exactly: OK', [{ role: 'user', text: 'Test' }]); $('#aist').textContent = 'Funziona (' + r.slice(0, 20) + ')'; }
    catch (e) { $('#aist').textContent = 'Errore: ' + e.message; }
  };
  $('#diag').onclick = async () => {
    const k = $('#key').value.replace(/\s+/g, ''), m = $('#model').value, out = $('#diagout'), L = [];
    const log = t => { L.push(t); out.textContent = L.join('\n'); };
    const base = 'https://generativelanguage.googleapis.com/v1beta/';
    log('Pagina: ' + location.origin + (navigator.serviceWorker && navigator.serviceWorker.controller ? ' (con service worker)' : ''));
    log('Online: ' + navigator.onLine + ' · chiave: ' + (k ? k.slice(0, 4) + '…' + k.length + ' caratteri' : 'mancante') + ' · modello: ' + (m || 'nessuno'));
    const tryF = async (name, url, opt) => {
      try { const r = await fetch(url, opt); const t = await r.text(); log(name + ': HTTP ' + r.status + ' ' + t.slice(0, 120).replace(/\s+/g, ' ')); }
      catch (e) { log(name + ': ERRORE ' + (e.name || '') + ' ' + (e.message || e)); }
    };
    await tryF('1 Lista modelli', base + 'models?pageSize=5&key=' + encodeURIComponent(k));
    if (m) {
      const body = JSON.stringify({ contents: [{ role: 'user', parts: [{ text: 'Say OK' }] }] });
      await tryF('2 Risposta (JSON)', base + 'models/' + encodeURIComponent(m) + ':generateContent?key=' + encodeURIComponent(k), { method: 'POST', headers: { 'Content-Type': 'application/json' }, body });
      await tryF('3 Risposta (semplice)', base + 'models/' + encodeURIComponent(m) + ':generateContent?key=' + encodeURIComponent(k), { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=UTF-8' }, body });
    } else log('2-3 saltati: prima premi Carica modelli');
    log('Fine. Fai uno screenshot di questo riquadro (la chiave non è visibile).');
  };
  const saveV = () => S('ec-voice', { voice: $('#voice').value, rate: +$('#rate').value });
  $('#voice').onchange = saveV; $('#rate').onchange = saveV;
  $('#tv').onclick = () => { saveV(); speak('Hi Andrea! This is your English coach. Are you ready for today\'s lesson?'); };
  $('#bk').onclick = () => {
    const data = { app: 'english-coach', v: 1, created: new Date().toISOString(), data: {} };
    Object.keys(localStorage).filter(k => k.startsWith('ec-') && k !== 'ec-ai').forEach(k => data.data[k] = S(k));
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(data)], { type: 'application/json' }));
    a.download = 'english-coach-backup_' + today() + '.json'; document.body.appendChild(a); a.click(); a.remove();
    S('ec-lastBackup', Date.now()); toast('Backup salvato nei Download.'); viewSettings();
  };
  $('#rs').onchange = e => {
    const f = e.target.files[0]; if (!f) return; const rd = new FileReader();
    rd.onload = () => { try { const j = JSON.parse(rd.result); if (j.app !== 'english-coach') throw 0; Object.entries(j.data).forEach(([k, v]) => S(k, v)); toast('Dati ripristinati.'); setTimeout(() => location.reload(), 900); } catch (x) { toast('Questo file non è un backup di English Coach.'); } };
    rd.readAsText(f);
  };
  $('#goal').onclick = () => { const p = profile(); goalSetup({ level: p.level, startH: p.startH, test: null }, true); };
  $('#retest').onclick = () => { placement(); };
}

/* ---------- Avvio ---------- */
$('#tabs').innerHTML = `<div class="in">${[['home', 'Oggi'], ['cards', 'Flashcard'], ['path', 'Percorso'], ['set', 'Profilo']].map(([k, n]) => `<button type="button" data-tab="${k}">${ICON[k]}<span>${n}</span></button>`).join('')}</div>`;
document.querySelectorAll('#tabs [data-tab]').forEach(b => b.onclick = () => { TAB = b.dataset.tab; render(); });
document.addEventListener('visibilitychange', () => { if (document.hidden) flushTime(); });
render();
try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) { }
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => { });

</script>
</body>
</html>
